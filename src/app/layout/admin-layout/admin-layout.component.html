<div
  class="admin-wrapper"
  [class.nav-expanded]="layoutUi.sidebarExpanded()"
  [class.nav-collapsed]="!layoutUi.sidebarExpanded()"
>
  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav
      mode="side"
      [opened]="true"
      disableClose
      class="sidenav"
      [class.sidenav-expanded]="layoutUi.sidebarExpanded()"
      [class.sidenav-collapsed]="!layoutUi.sidebarExpanded()"
    >
      <app-sidebar></app-sidebar>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <app-header></app-header>
      @if (ayContext.isReadOnlyScope()) {
        <div class="year-readonly-banner" role="status">
          <mat-icon>info</mat-icon>
          <span>
            Viewing <strong>{{ ayContext.effectiveYearLabel() }}</strong> (read-only — past academic year).
            Select the <strong>current</strong> or an <strong>upcoming</strong> year to add, edit, or delete.
          </span>
        </div>
      }
      <main class="content-body">
        <div class="content-main">
          @for (outletKey of [ayContext.routeOutletKey()]; track outletKey) {
            <div
              class="content-main-inner"
              [class.scope-transition-lock]="ayContext.scopeTransitioning()"
            >
              <router-outlet></router-outlet>
            </div>
          }
        </div>
        <app-footer></app-footer>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
