<section class="entity-history-page">
  <span
    [appPageChrome]="'Change history'"
    [pageChromeSubtitle]="historyChromeSubtitle"
    [pageChromeShowBack]="true"
    (pageChromeBack)="goBack()"
  ></span>

  <div class="card">
    <div class="card-title">
      <mat-icon>history</mat-icon>
      Field changes
    </div>
    @if (entityId) {
      <app-audit-history [entityId]="entityId" [entityType]="entityType"></app-audit-history>
    }
  </div>
</section>
