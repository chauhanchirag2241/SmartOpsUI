<section class="grade-setup-page">
  @if (!showForm) {
    <app-smart-data-table
      [config]="tableConfig"
      [data]="rows"
      (actionClicked)="onActionClicked($event)"
      (addButtonClicked)="onAddButtonClicked()"
    />
  } @else {
    <span [appPageChrome]="formMode === 'edit' ? 'Edit grade scale' : 'New grade scale'" [pageChromeShowBack]="true" (pageChromeBack)="closeForm()"></span>
    <p class="form-hint">Define grade bands — add or remove rows as needed.</p>

    @if (formError) {
      <div class="error-banner">{{ formError }}</div>
    }

    <div class="card">
      <div class="card-title"><mat-icon>grade</mat-icon> Scale details</div>
      <div class="grid2">
        <div class="field">
          <label>Scale name <span class="req">*</span></label>
          <input type="text" [(ngModel)]="formName" placeholder="e.g. CBSE 10-point scale" />
        </div>
        <div class="field">
          <label>Description</label>
          <input type="text" [(ngModel)]="formDescription" placeholder="Optional description" />
        </div>
        <div class="field">
          <label class="check-row">
            <input type="checkbox" [(ngModel)]="formIsDefault" />
            Use as default scale when exams have no override
          </label>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><mat-icon>format_list_numbered</mat-icon> Grade bands</div>
      <div class="band-rows">
        @for (row of gradeRows; track $index; let i = $index) {
          <div class="band-row">
            <div class="field">
              <label>Grade</label>
              <input type="text" [(ngModel)]="row.grade" placeholder="A1" />
            </div>
            <div class="field">
              <label>Min %</label>
              <input type="number" [(ngModel)]="row.minPercent" min="0" max="100" />
            </div>
            <div class="field">
              <label>Max %</label>
              <input type="number" [(ngModel)]="row.maxPercent" min="0" max="100" />
            </div>
            <div class="field">
              <label>Grade point</label>
              <input type="number" [(ngModel)]="row.gradePoint" min="0" />
            </div>
            <div class="field remark">
              <label>Remark</label>
              <input type="text" [(ngModel)]="row.description" placeholder="Outstanding" />
            </div>
            <button
              type="button"
              class="row-remove"
              title="Remove grade"
              (click)="removeGradeRow(i)"
            >
              <mat-icon>delete_outline</mat-icon>
            </button>
          </div>
        }
      </div>
      <button type="button" class="add-row-btn" (click)="addGradeRow()">
        <mat-icon>add</mat-icon> Add grade row
      </button>
    </div>

    <div class="footer-actions">
      <div class="footer-hint">Bands must not overlap; ranges are validated on save.</div>
      <app-action-button
        type="save"
        [label]="saving ? 'Saving...' : formMode === 'edit' ? 'Update scale' : 'Create scale'"
        [icon]="saving ? 'hourglass_empty' : 'check_circle'"
        [disabled]="saving"
        (action)="save()"
      />
    </div>
  }
</section>
