<section class="exam-groups-page">
  @if (!showForm) {
    <app-smart-data-table
      [config]="tableConfig"
      [data]="rows"
      (actionClicked)="onActionClicked($event)"
      (addButtonClicked)="onAddButtonClicked()"
    />
  } @else {
    <span [appPageChrome]="formMode === 'edit' ? 'Edit exam group' : 'New exam group'" [pageChromeShowBack]="true" (pageChromeBack)="closeForm()"></span>
    <p class="form-hint">Exams inside the group inherit its academic year and default grade scale.</p>

    @if (formError) {
      <div class="error-banner">{{ formError }}</div>
    }

    <div class="card">
      <div class="card-title"><mat-icon>folder_special</mat-icon> Group details</div>
      <div class="grid2">
        <div class="field">
          <label>Group name <span class="req">*</span></label>
          <input type="text" [(ngModel)]="formName" placeholder="e.g. Term 1 Exams 2025-26" />
        </div>
        <div class="field">
          <label>Academic year <span class="req">*</span></label>
          <select [(ngModel)]="formAcademicYearId">
            <option value="">Select year</option>
            @for (year of academicYears; track year.id) {
              <option [value]="year.id">{{ year.name }}</option>
            }
          </select>
        </div>
        <div class="field">
          <label>Evaluation type</label>
          <select [(ngModel)]="formEvaluationType">
            <option [ngValue]="ExamEvaluationType.Marks">Marks</option>
            <option [ngValue]="ExamEvaluationType.Grade">Grade</option>
            <option [ngValue]="ExamEvaluationType.Both">Marks &amp; Grade</option>
          </select>
        </div>
        <div class="field">
          <label>Default grade scale</label>
          <select [(ngModel)]="formGradeScaleId">
            <option value="">None</option>
            @for (scale of gradeScales; track scale.id) {
              <option [value]="scale.id">{{ scale.name }}</option>
            }
          </select>
        </div>
        <div class="field full">
          <label>Description</label>
          <textarea rows="2" [(ngModel)]="formDescription" placeholder="Optional description"></textarea>
        </div>
      </div>
    </div>

    <div class="footer-actions">
      <div class="footer-hint">Save the group, then add exams from the Exams screen.</div>
      <app-action-button
        type="save"
        [label]="saving ? 'Saving...' : formMode === 'edit' ? 'Update group' : 'Create group'"
        [icon]="saving ? 'hourglass_empty' : 'check_circle'"
        [disabled]="saving"
        (action)="save()"
      />
    </div>
  }
</section>
