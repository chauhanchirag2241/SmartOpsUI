<section class="exam-groups-page">
  @if (!showForm) {
    <app-smart-data-table
      [config]="tableConfig"
      [data]="rows"
      (actionClicked)="onActionClicked($event)"
      (addButtonClicked)="onAddButtonClicked()"
    />
  } @else {
    <span [appPageChrome]="formMode === 'edit' ? 'Edit exam group' : 'New exam group'" [pageChromeShowBack]="true" (pageChromeBack)="closeForm()"></span>
    <p class="form-hint">Exams inside the group inherit its default grade scale. Academic year is set per exam.</p>

    @if (formError) {
      <div class="error-banner">{{ formError }}</div>
    }

    <div class="card">
      <div class="card-title"><mat-icon>folder_special</mat-icon> Group details</div>
      <div class="grid2">
        <app-form-field
          label="Group name"
          type="text"
          [required]="true"
          [(ngModel)]="formName"
          placeholder="e.g. Term 1 Exams 2025-26"
        />
        <app-form-field
          label="Evaluation type"
          type="select"
          [(ngModel)]="formEvaluationType"
          [options]="evaluationTypeOptions"
        />
        <app-form-field
          label="Default grade scale"
          type="select"
          [(ngModel)]="formGradeScaleId"
          [options]="gradeScaleOptions"
          emptyOptionLabel="None"
        />
        <app-form-field
          label="Description"
          type="textarea"
          [fullWidth]="true"
          [(ngModel)]="formDescription"
          placeholder="Optional description"
        />
      </div>
    </div>

    <div class="footer-actions">
      <div class="footer-hint">Save the group, then add exams from the Exams screen.</div>
      <app-action-button
        type="save"
        [label]="saving ? 'Saving...' : formMode === 'edit' ? 'Update group' : 'Create group'"
        [icon]="saving ? 'hourglass_empty' : 'check_circle'"
        [disabled]="saving"
        (action)="save()"
      />
    </div>
  }
</section>
