<section class="exam-schedule-page">
  @if (!showForm) {
    <app-smart-data-table
      [config]="tableConfig"
      [data]="rows"
      (actionClicked)="onActionClicked($event)"
      (addButtonClicked)="onAddButtonClicked()"
      (exportClicked)="onExportClicked()"
    >
      <div tableFilters class="st-table-filters">
        <app-form-field
          label="Exam"
          type="select"
          variant="filter"
          [(ngModel)]="selectedExamId"
          [options]="examOptions"
          emptyOptionLabel="Select exam"
          (ngModelChange)="onExamChange()"
        />
        <app-form-field
          label="Class"
          type="select"
          variant="filter"
          [(ngModel)]="selectedClassId"
          [options]="examClassOptions"
          emptyOptionLabel="All classes"
          (ngModelChange)="loadSchedules()"
        />
      </div>
    </app-smart-data-table>
  } @else {
    <span [appPageChrome]="formMode === 'edit' ? 'Edit schedule slot' : 'Add schedule slot'" [pageChromeShowBack]="true" (pageChromeBack)="closeForm()"></span>
    <p class="form-hint">Pick exam and class, then set date, subject and time for this slot.</p>

    @if (formError) {
      <div class="error-banner">{{ formError }}</div>
    }

    <div class="card">
      <div class="card-title"><mat-icon>event</mat-icon> Slot details</div>
      <div class="grid2">
        <app-form-field
          label="Exam"
          type="select"
          [required]="true"
          [(ngModel)]="formExamId"
          [options]="examOptions"
          emptyOptionLabel="Select exam"
          (ngModelChange)="onFormExamChange()"
        />
        <app-form-field
          label="Class"
          type="select"
          [required]="true"
          [(ngModel)]="formClassId"
          [options]="formExamClassOptions"
          emptyOptionLabel="Select class"
          [disabled]="!formExamId"
        />
        <app-form-field
          label="Subject"
          type="select"
          [required]="true"
          [(ngModel)]="formSubjectId"
          [options]="subjectOptions"
          emptyOptionLabel="Select subject"
        />
        <app-form-field
          label="Exam date"
          type="date"
          [required]="true"
          [(ngModel)]="formExamDate"
        />
        <app-form-field label="Start time" type="time" [(ngModel)]="formStartTime" />
        <app-form-field label="End time" type="time" [(ngModel)]="formEndTime" />
        <app-form-field
          label="Room / Hall"
          type="text"
          [(ngModel)]="formRoomNo"
          placeholder="e.g. Hall A / Room 12"
        />
        <app-form-field
          label="Invigilator"
          type="select"
          [(ngModel)]="formInvigilatorId"
          [options]="employeeOptions"
          emptyOptionLabel="Not assigned"
        />
      </div>
    </div>

    <div class="footer-actions">
      <div class="footer-hint">Slots are independent — adding one never removes others.</div>
      <app-action-button
        type="save"
        [label]="saving ? 'Saving...' : formMode === 'edit' ? 'Update slot' : 'Add slot'"
        [icon]="saving ? 'hourglass_empty' : 'check_circle'"
        [disabled]="saving"
        (action)="save()"
      />
    </div>
  }
</section>
