<section class="exam-schedule-page">
  @if (!showForm) {
    <app-smart-data-table
      [config]="tableConfig"
      [data]="rows"
      (actionClicked)="onActionClicked($event)"
      (addButtonClicked)="onAddButtonClicked()"
      (exportClicked)="onExportClicked()"
    >
      <div tableFilters class="st-table-filters">
        <div class="filter-field">
          <label>Exam</label>
          <select [(ngModel)]="selectedExamId" (ngModelChange)="onExamChange()">
            <option value="">Select exam</option>
            @for (e of exams; track e.id) {
              <option [value]="e.id">{{ e.name }} ({{ e.examGroupName }})</option>
            }
          </select>
        </div>
        <div class="filter-field">
          <label>Class</label>
          <select [(ngModel)]="selectedClassId" (ngModelChange)="loadSchedules()">
            <option value="">All classes</option>
            @for (c of examClasses; track c.classId) {
              <option [value]="c.classId">{{ c.className }}</option>
            }
          </select>
        </div>
      </div>
    </app-smart-data-table>
  } @else {
    <span [appPageChrome]="formMode === 'edit' ? 'Edit schedule slot' : 'Add schedule slot'" [pageChromeShowBack]="true" (pageChromeBack)="closeForm()"></span>
    <p class="form-hint">Pick exam and class, then set date, subject and time for this slot.</p>

    @if (formError) {
      <div class="error-banner">{{ formError }}</div>
    }

    <div class="card">
      <div class="card-title"><mat-icon>event</mat-icon> Slot details</div>
      <div class="grid2">
        <div class="field">
          <label>Exam <span class="req">*</span></label>
          <select [(ngModel)]="formExamId" (ngModelChange)="onFormExamChange()">
            <option value="">Select exam</option>
            @for (e of exams; track e.id) {
              <option [value]="e.id">{{ e.name }} ({{ e.examGroupName }})</option>
            }
          </select>
        </div>
        <div class="field">
          <label>Class <span class="req">*</span></label>
          <select [(ngModel)]="formClassId" [disabled]="!formExamId">
            <option value="">Select class</option>
            @for (c of formExamClasses; track c.classId) {
              <option [value]="c.classId">{{ c.className }}</option>
            }
          </select>
        </div>
        <div class="field">
          <label>Subject <span class="req">*</span></label>
          <select [(ngModel)]="formSubjectId">
            <option value="">Select subject</option>
            @for (s of subjects; track s.id) {
              <option [value]="s.id">{{ s.name }}</option>
            }
          </select>
        </div>
        <div class="field">
          <label>Exam date <span class="req">*</span></label>
          <input type="date" [(ngModel)]="formExamDate" />
        </div>
        <div class="field">
          <label>Start time</label>
          <input type="time" [(ngModel)]="formStartTime" />
        </div>
        <div class="field">
          <label>End time</label>
          <input type="time" [(ngModel)]="formEndTime" />
        </div>
        <div class="field">
          <label>Room / Hall</label>
          <input type="text" [(ngModel)]="formRoomNo" placeholder="e.g. Hall A / Room 12" />
        </div>
        <div class="field">
          <label>Invigilator</label>
          <select [(ngModel)]="formInvigilatorId">
            <option value="">Not assigned</option>
            @for (emp of employees; track emp.id) {
              <option [value]="emp.id">{{ emp.name }}</option>
            }
          </select>
        </div>
      </div>
    </div>

    <div class="footer-actions">
      <div class="footer-hint">Slots are independent — adding one never removes others.</div>
      <app-action-button
        type="save"
        [label]="saving ? 'Saving...' : formMode === 'edit' ? 'Update slot' : 'Add slot'"
        [icon]="saving ? 'hourglass_empty' : 'check_circle'"
        [disabled]="saving"
        (action)="save()"
      />
    </div>
  }
</section>
