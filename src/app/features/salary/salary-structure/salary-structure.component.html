<div class="fees-page fee-structure-page">
  @if (showManage && selectedVersionId) {
    <app-salary-structure-manage
      [versionId]="selectedVersionId"
      [initialTab]="manageInitialTab"
      (cancel)="closeManage()"
      (changed)="onManageChanged()"
    />
  } @else {
    <app-smart-data-table
      *ngIf="!loading"
      [config]="tableConfig"
      [data]="versions"
      [rowClassFn]="versionRowClass"
      [initialFilterValue]="currentStatusFilter"
      [filterPanelActive]="tableFilterPanelActive"
      (filterChanged)="onFilterChanged($event)"
      (advancedFiltersCleared)="onTableFiltersCleared()"
      (actionClicked)="onActionClicked($event)"
      (addButtonClicked)="onAddButtonClicked()"
    >
    </app-smart-data-table>
    <div *ngIf="loading" class="empty-panel">Loading salary structures...</div>
  }

  <div class="overlay" [class.show]="showCreateVersionModal" (click)="showCreateVersionModal = false">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="mh">
        <div class="mt"><mat-icon>add_circle</mat-icon> New salary structure</div>
        <button type="button" class="mc-btn" (click)="showCreateVersionModal = false"><mat-icon>close</mat-icon></button>
      </div>
      <div class="mb">
        <div class="field">
          <label>Effective date</label>
          <input type="date" [(ngModel)]="createVersionForm.effectiveDate" />
        </div>
        <div class="field">
          <label>Copy from version (optional)</label>
          <select [(ngModel)]="createVersionForm.cloneFromVersionId">
            <option value="">Start empty</option>
            <option *ngFor="let v of versions" [value]="v['id']">
              {{ v['versionLabel'] }} ({{ v['statusLabel'] }})
            </option>
          </select>
        </div>
      </div>
      <div class="mf">
        <button type="button" class="btn-cancel" (click)="showCreateVersionModal = false">Cancel</button>
        <button type="button" class="btn-save" (click)="createVersion()"><mat-icon>check</mat-icon> Create</button>
      </div>
    </div>
  </div>
</div>
