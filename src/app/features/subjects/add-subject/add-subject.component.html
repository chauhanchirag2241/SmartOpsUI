@if (!embeddedInDialog) {
  <span [appPageChrome]="pageTitle" [pageChromeShowBack]="true" (pageChromeBack)="cancel.emit()"></span>
}

<form [formGroup]="subjectForm">
  @for (tab of tabs; track tab.stepIndex) {
    @for (section of tab.sections; track section.title) {
      <div class="card">
        <div class="card-title">
          <mat-icon>{{ section.icon }}</mat-icon>{{ section.title }}
        </div>
        <div [class]="section.layout">
          @for (field of section.fields; track field) {
            <app-dynamic-field
              [config]="configs[field]"
              [group]="subjectForm"
              [full]="field === 'medium'"
            />
          }
        </div>
      </div>
    }
  }
</form>

@if (!embeddedInDialog) {
  <div class="footer-actions">
    @if (mode !== 'view') {
      <div class="footer-actions-right">
        <app-action-button type="cancel" (action)="cancel.emit()" />
        <app-action-button
          type="save"
          [label]="isSaving ? 'Saving...' : (mode === 'edit' ? 'Update Subject' : 'Confirm & Add')"
          [icon]="isSaving ? 'hourglass_empty' : 'check_circle'"
          [disabled]="isSaving"
          (action)="saveSubject()"
        />
      </div>
    }
  </div>
}
